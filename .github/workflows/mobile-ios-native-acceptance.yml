name: Mobile (iOS offline native acceptance)

on:
  pull_request:
    # A draft runs nothing; marking it ready for review starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/mobile/**
      - scripts/mobile-ios-native/**
      - .github/workflows/mobile-ios-native-acceptance.yml
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.event.pull_request.draft != true && (github.event_name != 'pull_request' || github.base_ref == 'main')
    name: Exercise the offline demo on an owned iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-cocoapods-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/package.json', 'apps/mobile/app.config.ts') }}
          restore-keys: ios-cocoapods-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/octant-ios-derived-data
          key: ios-native-derived-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/package.json', 'apps/mobile/app.config.ts', 'apps/mobile/modules/**', 'apps/mobile/plugins/**', 'scripts/mobile-ios-native/**') }}
          restore-keys: ios-native-derived-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build and exercise the Release app without accounts or store signing
        env:
          OCTANT_IOS_DERIVED_DATA: ${{ runner.temp }}/octant-ios-derived-data
        run: python3 scripts/mobile-ios-native/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octant-ios-offline-native-acceptance
          path: ${{ runner.temp }}/octant-ios-native-acceptance
          if-no-files-found: warn
          retention-days: 7
