name: Visual check
# Draws the key screens in a pinned Chromium and fails when one changed visibly.
# A pull request with the `design change` label is an intended change: the run
# draws the new pictures, uploads them as `visual-check-<half>` artifacts and
# passes. It pushes nothing; a person commits the pictures with
# scripts/visual-baselines-from-ci.ts.
#
# `Visual check` is a required check, so it must report on every pull request
# and in the merge queue. A path filter on the trigger would leave it pending
# forever on a pull request that does not touch the screens; the `scope` job
# decides instead, and a skipped job counts as passed.
on:
  pull_request:
    # A draft runs nothing; marking it ready for review starts the run.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/theme/**
      - packages/contracts/src/theme.ts
      - DESIGN.md
      - .github/workflows/visual-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      draw: ${{ steps.scope.outputs.draw }}
    steps:
      - name: Decide whether the screens can have changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          case "${{ github.event_name }}" in
            # The pull request's own run already compared this change, and a
            # design change still waiting for its pictures must not stop the queue.
            merge_group) draw=false ;;
            pull_request)
              # Read the list on its own line, so a failed request fails the
              # step instead of reading as "no screen files changed".
              files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PULL}/files" --jq '.[].filename')"
              if grep -qE '^(apps/web/|packages/theme/|packages/contracts/src/theme\.ts$|DESIGN\.md$|\.github/workflows/visual-check\.yml$)' <<< "$files"; then
                draw=true
              else
                draw=false
              fi ;;
            *) draw=true ;;
          esac
          echo "draw=${draw}" >> "$GITHUB_OUTPUT"
          echo "Draw the key screens: ${draw}"
  visual:
    # The pictures are drawn in two halves at once; the "Visual check" job
    # below reports them as the one required check.
    name: Visual check (${{ matrix.shard }}/2)
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.draw == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      INTENDED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'design change') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Read the pinned browser version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The Chromium that goes with playwright-core, not the runner's Chrome,
      # so the baselines do not move when the runner image updates its browser.
      - name: Install the pinned Chromium
        run: bunx playwright-core install --with-deps chromium
        working-directory: apps/web
      - name: Draw and compare the key screens
        env:
          CI: "true"
          OCTANT_VISUAL_CHECK: "1"
          OCTANT_QA_ARTIFACTS: ${{ runner.temp }}/visual-check
          OCTANT_VISUAL_SHARD: ${{ matrix.shard }}/2
        run: |
          # Set only when writing: an empty value is still "set" to some readers.
          if [ "$INTENDED" = "true" ]; then export OCTANT_VISUAL_UPDATE=1; fi
          bun run --cwd apps/web visual:check
      - name: Explain how to accept the change
        if: failure()
        run: |
          shopt -s nullglob
          pictures=("${RUNNER_TEMP}"/visual-check/*.actual.png)
          if [ ${#pictures[@]} -eq 0 ] || [ "$INTENDED" = "true" ]; then
            # No screen differed, or update mode failed: the check itself broke.
            echo "::error::The visual check could not run to the end. See the log of the step above and the visual-check-${{ matrix.shard }} artifact."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::The key screens on main no longer match their baselines: a change with the design change label was merged without committing its pictures. Run scripts/visual-baselines-from-ci.ts ${{ github.run_id }}, review the diffs and commit them."
          else
            echo "::error::Intended? Add the \`design change\` label, then commit the new pictures with \`bun scripts/visual-baselines-from-ci.ts ${{ github.run_id }}\`."
          fi
      - name: List the new pictures
        if: success() && env.INTENDED == 'true'
        run: |
          shopt -s nullglob
          pictures=("${RUNNER_TEMP}"/visual-check/*.actual.png)
          {
            echo "## Visual check: design change"
            if [ ${#pictures[@]} -eq 0 ]; then
              echo "No screen changed visibly; there is nothing to commit."
            else
              echo "These pictures changed (or are new). Download them from the \`visual-check-${{ matrix.shard }}\` artifact, review them, then commit:"
              echo
              for picture in "${pictures[@]}"; do echo "- $(basename "$picture" .actual.png)"; done
              echo
              echo '```'
              echo "bun scripts/visual-baselines-from-ci.ts ${{ github.run_id }}"
              echo "# review the pictures, then commit apps/web/visual-baselines and push"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-check-${{ matrix.shard }}
          path: ${{ runner.temp }}/visual-check
          if-no-files-found: ignore
  result:
    # The required check. Skipped halves (a pull request that cannot change
    # the screens, or a draft) pass, as the single job's skip did before.
    name: Visual check
    needs: [scope, visual]
    # A draft runs nothing, as the single job did; ready_for_review starts it.
    # It runs after a failed or skipped half (the default `success()` would
    # skip it after a failure, and a skipped required check passes), but not
    # once the run is cancelled, which `always()` would still run it for: a push that supersedes this run cancels it, and the check then
    # ends cancelled, not with a red X for a half nobody let finish. A
    # cancelled check does not satisfy the requirement, so it never lets a
    # change through either. A half cancelled while the run goes on is still a
    # failure below.
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report both halves
        env:
          SCOPE: ${{ needs.scope.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          echo "scope: ${SCOPE}, drawing: ${VISUAL}"
          case "${VISUAL}" in
            success|skipped) ;;
            *) echo "::error::The visual check failed. See the Visual check (1/2) and (2/2) jobs."; exit 1 ;;
          esac
          case "${SCOPE}" in
            success|skipped) ;;
            *) echo "::error::The visual check could not decide its scope."; exit 1 ;;
          esac
