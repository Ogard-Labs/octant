name: Windows desktop package

on:
  pull_request:
    paths:
      - .github/workflows/windows-desktop.yml
      - apps/desktop/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - scripts/**
      - bun.lock
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Native Windows QA package
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate native desktop fixture syntax
        run: |
          foreach ($octantScript in @('scripts/run-windows-desktop.ps1', 'scripts/windows-desktop-window.ps1', 'scripts/stage-windows-desktop-qa.ps1')) {
            $octantTokens = $null
            $octantParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $octantScript), [ref]$octantTokens, [ref]$octantParseErrors)
            if ($octantParseErrors.Count) { throw ($octantParseErrors.Message -join "`n") }
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Prepare the pinned Electron runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-ci-electron.ts
      - name: Build the owned native peer mechanism fixture
        id: peer_fixture
        run: |
          bun build scripts/windows-desktop-peer/probe.ts --target=node --outfile "$env:RUNNER_TEMP/peer-probe.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S scripts/windows-desktop-peer -B "$env:RUNNER_TEMP/peer-qa" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/peer-qa" --config Release --target octant-windows-peer-launcher octant-windows-peer-appcontainer octant-windows-desktop-artifact-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the portable QA archive
        id: portable
        env:
          OCTANT_PACKAGE_TARGET: win32-x64
        run: bun run package:desktop
      - name: Stage unchanged normal Stable bytes under the current user known folder
        run: ./scripts/stage-windows-desktop-qa.ps1 -Mode Stable -PackageDirectory "$pwd/out/Octant-win32-x64"
      - name: Load the packaged native runtime
        run: bun scripts/smoke-windows-package.ts "$env:OCTANT_WINDOWS_QA_STABLE"
      - name: Exercise the packaged private credential helper with owned synthetic entries
        run: bun scripts/smoke-windows-credentials.ts "$env:OCTANT_WINDOWS_QA_STABLE/resources/native/octant-credential-helper.exe"
      - name: Build the existing owned Windows job fixture
        id: job_fixture
        run: |
          cmake -S scripts/windows-desktop-qa -B "$env:RUNNER_TEMP/desktop-owner" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/desktop-owner" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove native peer admission and reconnect cleanup in all runtimes
        run: |
          $env:OCTANT_WINDOWS_PEER_QA_LAUNCHER = Join-Path $env:RUNNER_TEMP 'peer-qa/Release/octant-windows-peer-launcher.exe'
          $env:OCTANT_WINDOWS_PEER_QA_APPCONTAINER = Join-Path $env:RUNNER_TEMP 'peer-qa/Release/octant-windows-peer-appcontainer.exe'
          $octantPeerBinding = Join-Path $env:OCTANT_WINDOWS_QA_STABLE 'resources/native/octant-desktop-peer-windows.node'
          $octantPeerReader = Join-Path $env:RUNNER_TEMP 'desktop-owner/Release/octant-windows-desktop-owner.exe'
          $octantPeerRuntimes = @(
            (Get-Command bun).Source
            (Get-Command node).Source
            (Join-Path $env:OCTANT_WINDOWS_QA_STABLE 'Octant.exe')
          )
          foreach ($octantPeerRuntime in $octantPeerRuntimes) {
            $octantPeerScope = [guid]::NewGuid().ToString('D')
            $octantPeerCopy = Join-Path $env:RUNNER_TEMP "octant-peer-copy-$octantPeerScope.node"
            if (Test-Path -LiteralPath $octantPeerCopy) { throw 'Refusing a pre-existing peer fixture copy' }
            Copy-Item -LiteralPath $octantPeerBinding -Destination $octantPeerCopy
            $env:OCTANT_WINDOWS_PEER_QA_COPY_BINDING = $octantPeerCopy
            if ($octantPeerRuntime -like '*Octant.exe') { $env:ELECTRON_RUN_AS_NODE = '1' }
            else { Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue }
            $octantPeerJoined = $false
            try {
              $octantPeerResult = @(& $octantPeerReader --profile-user-owner $octantPeerRuntime "$env:RUNNER_TEMP/peer-probe.mjs" $octantPeerBinding $octantPeerScope controller)
              $octantPeerCode = $LASTEXITCODE
              $octantPeerResult | Write-Output
              $octantPeerJoined = ($octantPeerResult -join "`n") -match '"ownedJobJoined":true'
              if ($octantPeerCode -ne 0 -or -not $octantPeerJoined) { throw 'The owned native peer mechanism proof failed or did not join' }
            } finally {
              if ($octantPeerJoined) {
                Remove-Item -LiteralPath $octantPeerCopy
                if (Test-Path -LiteralPath $octantPeerCopy) { throw 'Owned peer copy cleanup was not confirmed' }
                Write-Output '{"ownedPeerCopiedBindingAbsent":true}'
              }
            }
          }
      - name: Measure and validate the actual packaged artifact boundary
        if: ${{ !cancelled() && steps.peer_fixture.conclusion == 'success' && steps.portable.conclusion == 'success' && steps.job_fixture.conclusion == 'success' }}
        run: |
          $octantArtifactImage = (Resolve-Path -LiteralPath (Join-Path $env:OCTANT_WINDOWS_QA_STABLE 'Octant.exe')).ProviderPath
          & "$env:RUNNER_TEMP/desktop-owner/Release/octant-windows-desktop-owner.exe" --profile-user-owner "$env:RUNNER_TEMP/peer-qa/Release/octant-windows-desktop-artifact-qa.exe" $octantArtifactImage artifact scan owned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start and attach the normal packaged Windows desktop
        run: ./scripts/run-windows-desktop.ps1 -Launcher "$env:RUNNER_TEMP/desktop-owner/Release/octant-windows-desktop-owner.exe" -PackageDirectory "$env:OCTANT_WINDOWS_QA_STABLE" -OutputDirectory "$env:RUNNER_TEMP/desktop-proof"
      - name: Build the normal Windows Nightly QA package
        env:
          OCTANT_PACKAGE_TARGET: win32-x64
          OCTANT_PACKAGE_FLAVOR: nightly
        run: |
          $env:OCTANT_RELEASE_VERSION = bun -e "import { DESKTOP_PACKAGE_IDENTITY } from './scripts/package-desktop'; console.log(DESKTOP_PACKAGE_IDENTITY.version + '-preview.' + new Date().toISOString().slice(0, 10).replaceAll('-', '') + '.1')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run package:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/stage-windows-desktop-qa.ps1 -Mode Nightly -PackageDirectory "$pwd/out/Octant Nightly-win32-x64"
          bun scripts/smoke-windows-package.ts (Join-Path $env:OCTANT_WINDOWS_QA_ROOT 'Nightly')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Connect the normal packaged Windows Nightly to Stable
        run: ./scripts/run-windows-desktop.ps1 -Launcher "$env:RUNNER_TEMP/desktop-owner/Release/octant-windows-desktop-owner.exe" -PackageDirectory "$env:OCTANT_WINDOWS_QA_STABLE" -NightlyPackageDirectory "$env:OCTANT_WINDOWS_QA_NIGHTLY" -OutputDirectory "$env:RUNNER_TEMP/nightly-proof"
      - name: Remove only the joined owned package copies
        if: ${{ always() && env.OCTANT_WINDOWS_QA_ROOT != '' }}
        run: ./scripts/stage-windows-desktop-qa.ps1 -Mode Cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octant-windows-nightly-lifecycle
          path: ${{ runner.temp }}/nightly-proof
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octant-windows-desktop-lifecycle
          path: ${{ runner.temp }}/desktop-proof
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: octant-windows-x64-qa
          path: out/*-win32-x64.zip
          if-no-files-found: error
          retention-days: 3
