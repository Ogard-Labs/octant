name: Windows desktop package

on:
  pull_request:
    paths:
      - .github/workflows/windows-desktop.yml
      - apps/desktop/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - scripts/**
      - bun.lock
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Native Windows QA package
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Prepare the pinned Electron runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-ci-electron.ts
      - name: Build the portable QA archive
        env:
          OCTANT_PACKAGE_TARGET: win32-x64
        run: bun run package:desktop
      - name: Load the packaged native runtime
        run: bun scripts/smoke-windows-package.ts
      - name: Exercise the packaged private credential helper with owned synthetic entries
        run: bun scripts/smoke-windows-credentials.ts "$pwd/out/Octant-win32-x64/resources/native/octant-credential-helper.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: octant-windows-x64-qa
          path: out/*-win32-x64.zip
          if-no-files-found: error
          retention-days: 3
