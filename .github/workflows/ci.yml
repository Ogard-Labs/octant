name: CI

# No `push` trigger for `main`: the branch rules admit a commit only through
# the merge queue, and the queue's commit is the one that lands, so its
# `merge_group` run has already checked that exact commit. A run on push
# repeated every job for the same commit.
#
# A draft pull request runs nothing: every job below carries the draft guard,
# and `ready_for_review` starts the run when the draft is marked ready. Agents
# park work in drafts, and each push to one ran every job, macOS and Windows
# included (November 2026: about 60 pull requests in two days).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which heavy jobs a pull request actually needs before fanning out.
  # Merge queue and manual runs exercise everything. Pure documentation changes
  # still run `static` (formatter, decisions, path and wiring checks) while
  # skipping the test, sandbox, Docker and native desktop suites.
  scope:
    name: Determine affected CI scope
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      share: ${{ steps.scope.outputs.share }}
      download_manifest: ${{ steps.scope.outputs.download_manifest }}
      desktop_linux: ${{ steps.scope.outputs.desktop_linux }}
    steps:
      - name: Inspect changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          code=true
          share=true
          download_manifest=true
          desktop_linux=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PULL}/files" --jq '.[].filename')"
            # Keep `docs/design/**` out of the docs-only skip: server tests read
            # `docs/design/agent-tools.md`. Root `DESIGN.md` is checked by
            # `static` (`decisions:check`) and independently by `visual-check.yml`.
            if [ -n "$files" ] && ! grep -qvE '^(docs/|[^/]+\.md$|\.coderabbit\.yaml$)' <<< "$files" && ! grep -qE '^docs/design/' <<< "$files"; then
              code=false
              share=false
              download_manifest=false
              desktop_linux=false
            else
              if ! grep -qE '^(apps/share/|packages/|\.dockerignore$|bun\.lock$|package\.json$|\.github/workflows/ci\.yml$)' <<< "$files"; then
                share=false
              fi
              if ! grep -qE '^(apps/web/|apps/server/|packages/|scripts/smoke-browser-download-manifest-ui\.ts$|bun\.lock$|package\.json$|\.github/workflows/ci\.yml$)' <<< "$files"; then
                download_manifest=false
              fi
              if ! grep -qE '^(apps/desktop/|apps/server/|packages/cli/|packages/client-runtime/|packages/host-runtime/|packages/domain/|packages/contracts/|scripts/|bun\.lock$|package\.json$|\.github/workflows/ci\.yml$)' <<< "$files"; then
                desktop_linux=false
              fi
            fi
          fi
          {
            echo "code=${code}"
            echo "share=${share}"
            echo "download_manifest=${download_manifest}"
            echo "desktop_linux=${desktop_linux}"
          } >> "$GITHUB_OUTPUT"
          echo "Scope: code=${code} share=${share} download_manifest=${download_manifest} desktop_linux=${desktop_linux}"

  sandbox-native:
    name: Sandbox native contract (${{ matrix.os }})
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
      - name: Native process ownership and policy effects
        env:
          OCTANT_REQUIRE_LINUX_ISOLATION: "1"
        run: >-
          bun run --cwd apps/server test --
          src/process/macosSandboxScopeProcess.test.ts src/process/macosSandboxSupervisorProcess.test.ts
          src/process/sandboxLaunchPolicyProcess.test.ts src/process/claudeApprovalProcess.test.ts

  # One machine ran every step below in a row and took about 28 minutes, 25 of
  # them in the web and server suites. The jobs now run side by side, and the
  # two long suites are split across machines with vitest's `--shard`.
  static:
    name: Format, lint, typecheck, build
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # `decisions:check` asks what a decision number held before this
          # branch. The default depth-1 checkout has no such history, so the
          # history half of that gate would skip on every run.
          fetch-depth: 0
      - name: Keep guide source in octant-site
        run: |
          if git ls-files --error-unmatch -- apps/docs/ >/dev/null 2>&1; then
            echo "::error::Update the guide in Ogard-Labs/octant-site/docs and link its companion PR."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      # A case-only path collision is invisible on this runner's
      # case-sensitive filesystem; the gate reads git, not the checkout.
      - run: bun run paths:check
      - run: bun run wiring:check
      # The component-boundary and stylesheet gates. These are the rules a
      # recipe change is most likely to break, so they belong on the PR and
      # not only in a local `bun run verify`.
      - run: bun run ui:check
      # The portable tokens are generated from the stylesheets; a stylesheet
      # edit that leaves them stale fails here with the regenerate command.
      - run: bun run tokens:check
      - run: bun run --cwd apps/server browser:uploads:smoke
      - run: bun run style:check
      - run: bun run decisions:check
      # Cap Turbo concurrency so parallel TypeScript 7.0 compilers do not OOM
      # the 16 GB ubuntu-24.04 runner now that `typecheck` no longer serializes behind `^build`.
      - run: bun run typecheck --concurrency=3 --filter=!@octant/desktop --filter=!@octant/scripts
      # Resolves the phone's Expo configuration for each release profile with
      # every config plugin applied, so a broken plugin or manifest change
      # fails on the PR rather than in a maintainer's EAS build. The release
      # rules themselves are asserted by the mobile release-config test.
      - name: Resolve the mobile release Expo configurations
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          for profile in production android-internal; do
            EAS_BUILD_PROFILE="$profile" bunx expo config --type introspect --json >/dev/null
          done
          # The same, with the push capability on, so its config plugin runs.
          OCTANT_MOBILE_PUSH=1 EAS_BUILD_PROFILE=production bunx expo config --type introspect --json >/dev/null
      - run: bun run build --filter=!@octant/desktop --filter=!@octant/scripts
      # Fails a change that grows the renderer's first load past the byte budget
      # in scripts/initial-renderer-budget.json: main entry, initial CSS and
      # initial gzip. A shrink should lower the recorded budget.
      - run: bun run renderer:check

  # The macOS and Windows jobs that `checks` does not need also skip on a stack
  # layer whose base is not `main`: those runners cost several times a Linux
  # one, and the merge queue runs them on the commit that lands.
  electron-windows:
    name: Windows Electron installer cleanup and recovery
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Prepare isolated pinned verification dependencies without install scripts
        run: |
          $octantDesktopPackage = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $octantRootPackage = Get-Content package.json -Raw | ConvertFrom-Json
          $octantElectronVersion = $octantDesktopPackage.devDependencies.electron
          $octantVitestVersion = $octantRootPackage.workspaces.catalog.vitest
          if ($octantElectronVersion -notmatch '^\d+\.\d+\.\d+$' -or $octantVitestVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Verification versions must be exact repository pins' }
          $octantVerification = Join-Path $env:RUNNER_TEMP 'octant-electron-verification'
          if (Test-Path -LiteralPath $octantVerification) { throw 'Verification dependency folder already exists' }
          if (Test-Path -LiteralPath node_modules) { throw 'Checkout dependency folder already exists' }
          [void](New-Item -ItemType Directory -Path $octantVerification)
          npm install --prefix $octantVerification --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "electron@$octantElectronVersion" "vitest@$octantVitestVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [void](New-Item -ItemType Junction -Path (Join-Path $pwd 'node_modules') -Target (Join-Path $octantVerification 'node_modules'))
      - name: Prove actual Windows held-child cancellation and recovery boundaries
        working-directory: scripts
        run: node ../node_modules/vitest/vitest.mjs run ensure-ci-electron.test.ts
      - name: Install and execute the exact checksum-verified Windows Electron runtime
        env:
          GH_TOKEN: ${{ github.token }}
          electron_config_cache: ${{ runner.temp }}/octant-electron-cache
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          node scripts/ensure-ci-electron.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $octantElectronVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).devDependencies.electron
          $env:OCTANT_EXPECTED_ELECTRON = $octantElectronVersion
          & "$pwd/node_modules/electron/dist/electron.exe" -e 'if(process.versions.electron!==process.env.OCTANT_EXPECTED_ELECTRON)throw Error("Unexpected Electron runtime");console.log(JSON.stringify({platform:process.platform,arch:process.arch,electron:process.versions.electron,node:process.versions.node,ownedRuntimeJoined:true}))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  packages:
    name: Package tests
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # scripts tests build the Swift helpers and package the app; they run on the macOS job.
      # The web and server suites have their own sharded jobs below.
      # Cap Turbo concurrency so Vitest pools do not oversubscribe the 4-vCPU runner.
      - run: bun run test --concurrency=2 --filter=!@octant/desktop --filter=!@octant/scripts --filter=!@octant/server --filter=!@octant/web

  # The pure policy and schema suites on Windows, so a POSIX path assumption in
  # them shows up before a Windows host relies on it. Not a required check (not
  # in `checks` below) until it has been seen green on the hosted runner.
  packages-windows:
    name: Package tests on Windows (domain, contracts)
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Keep fixtures byte-identical to the Linux checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test --concurrency=2 --filter=@octant/domain --filter=@octant/contracts

  # Work and Code on Windows against real Windows processes: the process-tree
  # stop, a Code terminal and the harness shell opening PowerShell, and
  # compiled fake Codex, Claude, OpenCode, Pi and Kilo ACP runtimes. Not a
  # required check (not in `checks` below) until it has been seen green on the
  # hosted runner.
  server-windows:
    name: Server Full access tests on Windows
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Compile the fake provider runtimes into Windows programs
        shell: pwsh
        run: |
          bun build --compile apps/server/src/providers/fixtures/fakeCodexCli.ts --outfile "$env:RUNNER_TEMP/fake-codex/codex.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The fake Codex did not compile' }
          bun build --compile apps/server/src/providers/fixtures/fakeClaudeCli.ts --outfile "$env:RUNNER_TEMP/fake-claude/claude.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The fake Claude did not compile' }
          bun build --compile apps/server/src/providers/fixtures/fakeOpenCodeCli.ts --outfile "$env:RUNNER_TEMP/fake-opencode/opencode.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The fake OpenCode did not compile' }
          bun build --compile apps/server/src/providers/fixtures/fakePiCli.ts --outfile "$env:RUNNER_TEMP/fake-pi/pi.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The fake Pi did not compile' }
          bun build --compile apps/server/src/providers/fixtures/fakeKiloAcpAgent.ts --outfile "$env:RUNNER_TEMP/fake-kilo/kilo.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The fake Kilo ACP agent did not compile' }
          cmake -S apps/desktop/native/windows-confine -B "$env:RUNNER_TEMP/confine-build" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'The Windows confinement launcher did not configure' }
          cmake --build "$env:RUNNER_TEMP/confine-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'The Windows confinement launcher did not compile' }
      - name: Run provider launches, shells and terminals on Windows
        working-directory: apps/server
        shell: pwsh
        run: |
          $env:OCTANT_FAKE_CODEX_EXE = "$env:RUNNER_TEMP/fake-codex/codex.exe"
          $env:OCTANT_FAKE_CLAUDE_EXE = "$env:RUNNER_TEMP/fake-claude/claude.exe"
          $env:OCTANT_FAKE_OPENCODE_EXE = "$env:RUNNER_TEMP/fake-opencode/opencode.exe"
          $env:OCTANT_FAKE_PI_EXE = "$env:RUNNER_TEMP/fake-pi/pi.exe"
          $env:OCTANT_FAKE_ACP_EXE = "$env:RUNNER_TEMP/fake-kilo/kilo.exe"
          $env:OCTANT_WINDOWS_CONFINE_EXE = "$env:RUNNER_TEMP/confine-build/Release/octant-windows-confine.exe"
          bun run test src/process/windowsProcessTree.test.ts src/code/terminalProcessPort.windows.test.ts src/code/repositoryTestProcessPort.windows.test.ts src/code/languageServices.windows.test.ts src/code/terminalShell.test.ts src/harness/windowsFullAccessShell.test.ts src/providers/codexProcess.windows.test.ts src/providers/providerFamilies.windows.test.ts src/process/windowsProviderProgram.test.ts src/process/nodeOwnedProcessReceipt.windows.test.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The self-hostable share service (apps/share) ships as a Docker image. Build
  # it on every PR so the Dockerfile never rots, and push it to GHCR when the
  # merge queue lands the commit, so users can `docker pull` instead of building.
  share-image:
    name: Build the share-service image
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.share == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'merge_group'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: apps/share/Dockerfile
          push: ${{ github.event_name == 'merge_group' }}
          tags: |
            ghcr.io/ogard-labs/octant-share:latest
            ghcr.io/ogard-labs/octant-share:${{ github.event.merge_group.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web tests (${{ matrix.shard }}/5)
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # A failing shard must not hide what the other shards would report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web test -- --shard=${{ matrix.shard }}/5

  server:
    name: Server unit tests (${{ matrix.shard }}/4)
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - env:
          OCTANT_DATA_DIR: ${{ runner.temp }}/octant-ci-data
          # The runner image ships kotlinc and java, so the pairing smoke test
          # runs the phone's Android TLS exchange on a JVM. Required here so an
          # image without them fails the shard instead of skipping it.
          OCTANT_REQUIRE_KOTLINC: "1"
        run: bun run --cwd apps/server test:unit -- --exclude=src/bunServe.test.ts --shard=${{ matrix.shard }}/4

  # Process and smoke suites run serially (`maxWorkers: 1`), so keeping them on
  # dedicated shards prevents a slow serial smoke from skewing parallel unit shards.
  server-process:
    name: Server process tests (${{ matrix.shard }}/2)
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - env:
          OCTANT_DATA_DIR: ${{ runner.temp }}/octant-ci-data
          OCTANT_REQUIRE_KOTLINC: "1"
        # Process-spawning and browser-realm suites need a macOS host or a real network; run them locally.
        run: bun run --cwd apps/server test:process -- --exclude=src/providers/acpProcess.test.ts --exclude=src/remote/remoteExitEvidenceA.smoke.test.ts --shard=${{ matrix.shard }}/2

  checks:
    # The branch rules require a check with exactly this name. It passes only
    # when every job it needs passed, so a shard count can change without
    # touching the rules. `always()` matters: a skipped required check counts
    # as passed, so this job must run, and fail, when a needed job did not pass.
    name: Format, lint, typecheck, test, build
    # Skipped on a draft along with the jobs it needs. A draft cannot merge, and
    # marking it ready runs this again before the merge queue runs it once more.
    if: always() && github.event.pull_request.draft != true
    needs: [scope, static, packages, web, server, server-process, sandbox-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          CODE_RESULTS: ${{ needs.packages.result }} ${{ needs.web.result }} ${{ needs.server.result }} ${{ needs.server-process.result }} ${{ needs.sandbox-native.result }}
        run: |
          echo "scope=$SCOPE_RESULT static=$STATIC_RESULT code=$CODE_SCOPE jobs=($CODE_RESULTS)"
          [ "$SCOPE_RESULT" = "success" ] || exit 1
          [ "$STATIC_RESULT" = "success" ] || exit 1
          for result in $CODE_RESULTS; do
            if [ "$CODE_SCOPE" = "false" ]; then
              [ "$result" = "skipped" ] || [ "$result" = "success" ] || exit 1
            else
              [ "$result" = "success" ] || exit 1
            fi
          done

  download-manifest-ui:
    name: Browser download manifest rendered review
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.download_manifest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Read the pinned browser version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: bun node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bun run smoke:browser-download-manifest-ui
        env:
          OCTANT_QA_OUTPUT: ${{ runner.temp }}/download-manifest-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-manifest-ui
          path: ${{ runner.temp }}/download-manifest-ui
          if-no-files-found: ignore

  desktop:
    name: Desktop and scripts (macOS)
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/server browser:uploads:smoke
      - name: Read the pinned Electron version
        id: electron
        run: echo "version=$(bun -e 'console.log(require("./apps/desktop/package.json").devDependencies.electron)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/octant-electron-cache
          key: electron-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      # Desktop tests import the pinned Electron package too, so install it
      # before they run rather than waiting for the later native smokes.
      - name: Install pinned Electron for native process checks
        id: pinned_electron
        env:
          GH_TOKEN: ${{ github.token }}
          electron_config_cache: ${{ runner.temp }}/octant-electron-cache
        run: bun scripts/ensure-ci-electron.ts
      - name: Native download redirect source receipt
        timeout-minutes: 2
        run: bun run smoke:browser-download-source
      - name: Native page-started local-navigation guard
        timeout-minutes: 3
        run: bun run smoke:browser-local-navigation
      # Prove the protocol workers' native boundary before the broader suites.
      - name: Bun export worker isolation
        id: export_worker_bun
        timeout-minutes: 2
        run: bun run --cwd apps/server canvas:export:plugin:smoke
      - name: Installed example through native export approval
        timeout-minutes: 3
        run: |
          set -euo pipefail
          export_example_directory=$(mktemp -d "$RUNNER_TEMP/octant-export-example.XXXXXX")
          trap 'rm -r -- "$export_example_directory"' EXIT
          # The reference package is an independent first-party change. Pin its
          # source while validating the loader without duplicating its diff.
          git fetch --no-tags origin e5693698170efae0fbf399984d72fea90c39835c
          git archive e5693698170efae0fbf399984d72fea90c39835c packages/plugin-api/examples/docs-md-export | tar -x -C "$export_example_directory"
          OCTANT_QA_EXPORT_EXAMPLE_ROOT="$export_example_directory/packages/plugin-api/examples/docs-md-export" bun run --cwd apps/server canvas:export:installed:smoke
          test -z "$(git status --porcelain -- packages/plugin-api)"
      - name: Electron Node export worker isolation
        if: ${{ !cancelled() && steps.pinned_electron.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          export_smoke_directory=$(mktemp -d "$RUNNER_TEMP/octant-export-smoke.XXXXXX")
          trap 'rm -r -- "$export_smoke_directory"' EXIT
          bun build apps/server/src/canvas/canvasExportWorker.smoke.ts --target=node --format=esm --outfile "$export_smoke_directory/canvasExportWorker.smoke.mjs"
          cp apps/server/src/canvas/canvasExportWorker.mjs "$export_smoke_directory/canvasExportWorker.mjs"
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/Electron.app/Contents/MacOS/Electron "$export_smoke_directory/canvasExportWorker.smoke.mjs"
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run --cwd apps/desktop test
      # Exercise the role-selecting entry in sandboxed Electron, including
      # direct-network refusal, the filtered proxy, and forwarded input.
      - name: Canvas prototype containment
        timeout-minutes: 8
        run: bun run smoke:canvas-prototype-containment
      # The scripts suite covers the signing pipeline: what would be run, in
      # what order, and that a declared release refuses to finish unsigned. The
      # signing itself needs the maintainer's Developer ID and notary
      # credentials, so it is not exercised here — no secret is read on a pull
      # request, and this job deliberately does not package a release.
      - run: bun run --cwd scripts test
      # The packaged app runs outside provider drivers on Electron's Node, so
      # the escape tests below also run a driver on the Electron the desktop
      # app pins. The earlier install step makes that binary mandatory rather
      # than letting a native case skip when the release download fails.
      # The ordinary Nightly client, in this Electron, against a development
      # host on a throwaway folder and port that a synthetic Stable owns with
      # Stable's own lease owner and client lifetime: the renderer, a Chat
      # turn, brokered pickers, keys and approvals, the embedded Browser,
      # lease loss, a host restart, two separate hosts, and quit-one and
      # quit-last. Only the signed native binding is stood in for, so it needs
      # no signing secret; the harness it builds is never packaged.
      - name: Nightly client smoke
        timeout-minutes: 10
        run: bun scripts/smoke-nightly-client.ts
      # Combined into one Vitest invocation to avoid repeated startup overhead;
      # every group stays listed here for macOS-specific evidence:
      # - Confined Code/Work opens prove O_NOFOLLOW_ANY on macOS (server shards
      #   only exercise /proc/self/fd on Linux):
      #     artifactMirrorFilePort, threadArtifactPurge, codeDirectoryPort,
      #     workFilesystemPort, workConfinedWrite.
      # - Language and debug services run under Seatbelt here (Linux runs the
      #   Bubblewrap assertions when `/usr/bin/bwrap` is present):
      #     codeLanguageServiceProcess, installedLanguageServersProcess,
      #     codeDebugServiceProcess.
      # - Outside provider drivers run under their own Seatbelt profile (Linux
      #   refuses them), and Cua's daemon port resolves home via `/usr/bin/id -P`
      #   on macOS vs `getent` on Linux:
      #     outsideDriverProcess.escape, desktopDaemonPort.
      # - Seatbelt escape probes (darwin-gated on Linux shards): Seatbelt write,
      #   Keychain, home and egress denials, session escape cleanup, hostile
      #   proxy-only egress, secret guard, and confined credential commands:
      #     seatbeltProfile, sandboxLaunchPolicyProcess, sessionEscapeProcess,
      #     secretGuard, providerRuntimeNetwork.hostile,
      #     confinedCommandCredentialProcess.
      - name: macOS server, language-service and Seatbelt escape probes
        timeout-minutes: 12
        run: >-
          bun run --cwd apps/server test --
          src/canvas/artifactMirrorFilePort.test.ts
          src/persistence/threadArtifactPurge.test.ts
          src/code/codeDirectoryPort.test.ts
          src/work/workFilesystemPort.test.ts
          src/work/workConfinedWrite.test.ts
          src/code/codeLanguageServiceProcess.test.ts
          src/code/installedLanguageServersProcess.test.ts
          src/code/codeDebugServiceProcess.test.ts
          src/providers/outsideDriverProcess.escape.test.ts
          src/computerUse/desktopDaemonPort.test.ts
          src/process/seatbeltProfile.test.ts
          src/process/sandboxLaunchPolicyProcess.test.ts
          src/process/sessionEscapeProcess.test.ts
          src/process/secretGuard.test.ts
          src/network/providerRuntimeNetwork.hostile.test.ts
          src/secretStores/confinedCommandCredentialProcess.test.ts

  desktop-linux:
    name: Desktop Linux client trust
    needs: scope
    if: github.event.pull_request.draft != true && needs.scope.outputs.desktop_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Bubblewrap needs unprivileged user namespaces, which Ubuntu's AppArmor
      # restricts by default. Only this throwaway runner relaxes it; the user
      # guide gives people an AppArmor profile instead.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          bubblewrap dbus gnome-keyring libsecret-tools
      # The kernel peer checks on a real path socket: a same-user peer is
      # admitted under SO_PEERPIDFD and under the forced pidfd_open fallback;
      # a bwrap --unshare-all peer, another user (sudo -u nobody) and a
      # descriptor handed over with SCM_RIGHTS are refused; a pidfd exit and
      # an EOF each revoke leases; a stale socket is unlinked only under its
      # lock; and a moved, loosened or linked launcher target refuses.
      # Required here, so a missing bwrap or sudo fails instead of skipping.
      - env:
          OCTANT_REQUIRE_LINUX_ISOLATION: "1"
        run: bun run --cwd scripts test -- build-desktop-peer-linux.test.ts
      - env:
          OCTANT_REQUIRE_DESKTOP_PREVIEW_ISOLATION: "1"
        run: bun run --cwd apps/server test -- src/computerUse/desktopPreview.process.test.ts
      # A provider runtime's capsule under real Bubblewrap cannot read the
      # person's credentials beside its Project or inside a home opened as
      # one. Only this job installs Bubblewrap, so it is required here.
      - env:
          OCTANT_REQUIRE_LINUX_ISOLATION: "1"
        run: >-
          bun run --cwd apps/server test --
          src/process/linuxConfinement.test.ts
          -t "a provider runtime under Bubblewrap"
      - name: Sandbox policy native launch probes
        env:
          OCTANT_REQUIRE_LINUX_ISOLATION: "1"
        run: >-
          bun run --cwd apps/server test --
          src/process/sandboxLaunchPolicyProcess.test.ts
      # The real-page Browser suite drives the runner's Chrome through
      # Playwright; its launch hook timed out on ubuntu-24.04 (run
      # 42205818274). It is not part of Linux client trust, and the macOS job
      # above runs it with the rest of the desktop suite.
      - name: Read the pinned Electron version
        id: electron
        run: echo "version=$(bun -e 'console.log(require("./apps/desktop/package.json").devDependencies.electron)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/octant-electron-cache
          key: electron-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      - name: Install pinned Electron for desktop imports
        env:
          GH_TOKEN: ${{ github.token }}
          electron_config_cache: ${{ runner.temp }}/octant-electron-cache
        run: bun scripts/ensure-ci-electron.ts
      - run: bun run --cwd apps/desktop test -- --exclude=src/browserSurfaceHost.realPage.test.ts
      # Nightly's test data and Octant's credentials in one real unlocked
      # keyring: neither reads, replaces nor clears the other.
      - env:
          OCTANT_SECRET_SERVICE_KEYRING_TEST: "1"
        run: >-
          dbus-run-session -- sh -c
          'printf octant-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
          bun run --cwd packages/host-runtime test -- src/secretServiceKeyringSeparation.test.ts'
