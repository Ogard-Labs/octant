name: CI

# No `push` trigger for `main`: the branch rules admit a commit only through
# the merge queue, and the queue's commit is the one that lands, so its
# `merge_group` run has already checked that exact commit. A run on push
# repeated every job for the same commit.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One machine ran every step below in a row and took about 28 minutes, 25 of
  # them in the web and server suites. The jobs now run side by side, and the
  # two long suites are split across machines with vitest's `--shard`.
  static:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # `decisions:check` asks what a decision number held before this
          # branch. The default depth-1 checkout has no such history, so the
          # history half of that gate would skip on every run.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      # A case-only path collision is invisible on this runner's
      # case-sensitive filesystem; the gate reads git, not the checkout.
      - run: bun run paths:check
      - run: bun run wiring:check
      # The component-boundary and stylesheet gates. These are the rules a
      # recipe change is most likely to break, so they belong on the PR and
      # not only in a local `bun run verify`.
      - run: bun run ui:check
      - run: bun run style:check
      - run: bun run decisions:check
      - run: bun run typecheck --filter=!@octant/desktop --filter=!@octant/scripts
      # Resolves the phone's Expo configuration for each release profile with
      # every config plugin applied, so a broken plugin or manifest change
      # fails on the PR rather than in a maintainer's EAS build. The release
      # rules themselves are asserted by the mobile release-config test.
      - name: Resolve the mobile release Expo configurations
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          for profile in production android-internal; do
            EAS_BUILD_PROFILE="$profile" bunx expo config --type introspect --json >/dev/null
          done
      - run: bun run build --filter=!@octant/desktop --filter=!@octant/scripts

  packages:
    name: Package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # scripts tests build the Swift helpers and package the app; they run on the macOS job.
      # The web and server suites have their own sharded jobs below.
      - run: bun run test --filter=!@octant/desktop --filter=!@octant/scripts --filter=!@octant/server --filter=!@octant/web

  web:
    name: Web tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # A failing shard must not hide what the other shards would report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test --filter=@octant/web -- --shard=${{ matrix.shard }}/5

  server:
    name: Server tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The suite imports the workspace packages from their built output.
      - run: bun run build --filter='@octant/server^...'
      - env:
          OCTANT_DATA_DIR: ${{ runner.temp }}/octant-ci-data
          # The runner image ships kotlinc and java, so the pairing smoke test
          # runs the phone's Android TLS exchange on a JVM. Required here so an
          # image without them fails the shard instead of skipping it.
          OCTANT_REQUIRE_KOTLINC: "1"
        # Process-spawning and browser-realm suites need a macOS host or a real network; run them locally.
        run: bun run --cwd apps/server test -- --exclude=src/bunServe.test.ts --exclude=src/providers/acpProcess.test.ts --exclude=src/remote/remoteExitEvidenceA.smoke.test.ts --shard=${{ matrix.shard }}/4

  checks:
    # The branch rules require a check with exactly this name. It passes only
    # when every job it needs passed, so a shard count can change without
    # touching the rules. `always()` matters: a skipped required check counts
    # as passed, so this job must run, and fail, when a needed job did not pass.
    name: Format, lint, typecheck, test, build
    if: always()
    needs: [static, packages, web, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "static, packages, web, server: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  desktop:
    name: Desktop and scripts (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run --cwd apps/desktop test
      # Confined Code and Work opens prove where they landed with
      # O_NOFOLLOW_ANY on macOS and /proc/self/fd on Linux. The server job
      # runs only the Linux path, so the ancestor-swap port tests run here too.
      - run: >-
          bun run --cwd apps/server test --
          src/canvas/artifactMirrorFilePort.test.ts
          src/persistence/threadArtifactPurge.test.ts
          src/code/codeDirectoryPort.test.ts
          src/work/workFilesystemPort.test.ts
          src/work/workConfinedWrite.test.ts
      # The scripts suite covers the signing pipeline: what would be run, in
      # what order, and that a declared release refuses to finish unsigned. The
      # signing itself needs the maintainer's Developer ID and notary
      # credentials, so it is not exercised here — no secret is read on a pull
      # request, and this job deliberately does not package a release.
      - run: bun run --cwd scripts test
      # Language services: the bundled TypeScript server answers a two-file
      # fixture under Seatbelt, and a hostile server a person added cannot run
      # another program, reach the network, or write the checkout. A debug
      # session's fixture adapter and program stop, step, and exit under
      # Seatbelt while the program cannot write outside the checkout or reach
      # a host no rule allows. The Linux server shards run the same tests under
      # Bubblewrap; this is their macOS evidence.
      - run: >-
          bun run --cwd apps/server test --
          src/code/codeLanguageServiceProcess.test.ts
          src/code/installedLanguageServersProcess.test.ts
          src/code/codeDebugServiceProcess.test.ts
      # An outside provider driver runs under its own Seatbelt profile and
      # Linux refuses to start one, so its escape tests (network, files
      # outside its package, the home folder, exec, host variables) skip on
      # the server shards and only run here. The Cua daemon port finds the
      # home with `/usr/bin/id -P` on macOS and `getent` on Linux; its tests
      # hold that answer against Node's own user-database lookup, so this is
      # the evidence the macOS lookup returns the home.
      - run: >-
          bun run --cwd apps/server test --
          src/providers/outsideDriverProcess.escape.test.ts
          src/computerUse/desktopDaemonPort.test.ts
