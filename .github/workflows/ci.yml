name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # `decisions:check` asks what a decision number held before this
          # branch. The default depth-1 checkout has no such history, so the
          # history half of that gate would skip on every run.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      # A case-only path collision is invisible on this runner's
      # case-sensitive filesystem; the gate reads git, not the checkout.
      - run: bun run paths:check
      - run: bun run wiring:check
      - run: bun run decisions:check
      - run: bun run typecheck --filter=!@octant/desktop --filter=!@octant/scripts
      # scripts tests build the Swift helpers and package the app; they run on the macOS job.
      - run: bun run test --filter=!@octant/desktop --filter=!@octant/scripts --filter=!@octant/server
      - env:
          OCTANT_DATA_DIR: ${{ runner.temp }}/octant-ci-data
        # Process-spawning and browser-realm suites need a macOS host or a real network; run them locally.
        run: bun run --cwd apps/server test -- --exclude=src/bunServe.test.ts --exclude=src/providers/acpProcess.test.ts --exclude=src/remote/remoteExitEvidenceA.smoke.test.ts
      - run: bun run build --filter=!@octant/desktop --filter=!@octant/scripts

  desktop:
    name: Desktop and scripts (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run --cwd apps/desktop test
      # The scripts suite covers the signing pipeline: what would be run, in
      # what order, and that a declared release refuses to finish unsigned. The
      # signing itself needs the maintainer's Developer ID and notary
      # credentials, so it is not exercised here — no secret is read on a pull
      # request, and this job deliberately does not package a release.
      - run: bun run --cwd scripts test

  linux-capsule:
    name: Linux execution capsule (gVisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the protected runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl dbus-user-session gnupg podman rsync uidmap xfsprogs
          curl --fail --silent --show-error --location https://gvisor.dev/archive.key --output /tmp/gvisor.key
          gpg --dearmor --output /tmp/gvisor-archive-keyring.gpg /tmp/gvisor.key
          sudo install --mode 0644 /tmp/gvisor-archive-keyring.gpg /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes runsc
      - name: Prepare the dedicated Station identity and quota-backed rootless store
        run: |
          bun_path=$(command -v bun)
          sudo install --mode 0755 "$bun_path" /usr/local/bin/bun
          sudo useradd --create-home --home-dir /var/lib/octant --shell /bin/bash octant
          sudo truncate --size 12G /var/tmp/octant-capsule-ci.xfs
          sudo mkfs.xfs -f /var/tmp/octant-capsule-ci.xfs
          sudo mkdir --parents /var/lib/octant-capsule-ci
          sudo mount --options loop,pquota,nodev,nosuid /var/tmp/octant-capsule-ci.xfs /var/lib/octant-capsule-ci
          sudo chown octant:octant /var/lib/octant-capsule-ci
          octant_uid=$(id --user octant)
          sudo install --directory --mode 0700 --owner octant --group octant "/run/user/${octant_uid}"
          sudo loginctl enable-linger octant
          sudo systemctl start "user@${octant_uid}.service"
          sudo --user octant mkdir --parents /var/lib/octant/.config/containers
          printf '%s\n' \
            '[storage]' \
            'driver = "overlay"' \
            'graphroot = "/var/lib/octant-capsule-ci/storage"' \
            "runroot = \"/run/user/${octant_uid}/containers\"" \
            | sudo --user octant tee /var/lib/octant/.config/containers/storage.conf >/dev/null
          sudo install --directory --mode 0700 --owner octant --group octant /var/lib/octant/ci
          sudo rsync --archive --chown=octant:octant --exclude=.git/ "$GITHUB_WORKSPACE/" /var/lib/octant/ci/
      - name: Prove the rootless Podman and systrap prerequisites
        run: |
          octant_uid=$(id --user octant)
          sudo --user octant env -i \
            HOME=/var/lib/octant \
            XDG_RUNTIME_DIR="/run/user/${octant_uid}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${octant_uid}/bus" \
            PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/bin/podman info --format json
          sudo --user octant env -i \
            HOME=/var/lib/octant \
            PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/bin/runsc --platform=systrap --rootless --network=none "do" true
      - name: Prove two protected capsules and a reviewed bundle export
        env:
          OCTANT_GVISOR_CAPSULE_IMAGE: docker.io/alpine/git@sha256:6f8eae2205a85c51106a9650e574a37fb1d5e4f645e5f6ea57cb57b9462cd4cf
        run: |
          octant_uid=$(id --user octant)
          sudo --user octant env -i \
            HOME=/var/lib/octant \
            XDG_RUNTIME_DIR="/run/user/${octant_uid}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${octant_uid}/bus" \
            PATH=/usr/local/bin:/usr/bin:/bin \
            OCTANT_RUN_GVISOR_CAPSULE_EVIDENCE=1 \
            OCTANT_GVISOR_CAPSULE_IMAGE="$OCTANT_GVISOR_CAPSULE_IMAGE" \
            OCTANT_DESKTOP_BRIDGE_SECRET=octant-secret-canary \
            GH_TOKEN=octant-secret-canary \
            SSH_AUTH_SOCK=/tmp/octant-secret-canary.sock \
            /usr/local/bin/bun run --cwd /var/lib/octant/ci/apps/server test:evidence -- \
              src/executionCapsule/gvisorExecutionCapsuleSmoke.integration.test.ts
