name: One pull request per issue

# AGENTS.md: one issue gets one branch and one pull request. In November 2026
# one issue had about 35 open slice pull requests, and every one ran the full
# CI. This check fails a pull request that delivers an issue another open pull
# request already delivers, unless the two are layers of the same stack.
#
# A pull request names the issue it delivers with a Linear keyword ("Fixes
# OCT-123", "Closes", "Resolves", "Part of", "Towards"). Bare mentions are
# ignored: most descriptions also cite the maintainer-actions issue or related
# work, and counting those would flag nearly every pull request.
#
# Not a required check: a maintainer can still merge a deliberate exception.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-per-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: One pull request per issue
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Refuse a second open pull request for the same issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # Linear's own closing and contributing keywords, optionally
          # followed by a Linear issue URL instead of the bare identifier.
          keyword='(close[sd]?|closing|fix(e[sd])?|fixing|resolve[sd]?|resolving|complete[sd]?|part of|towards?)'
          delivered() {
            grep -oiE "${keyword}[[:space:]]*:?[[:space:]]*(https://linear\.app/[^[:space:])]*/)?OCT-[0-9]+" \
              | grep -oE 'OCT-[0-9]+' | sort -u || true
          }
          mine=$(printf '%s\n%s\n' "$TITLE" "$BODY" | delivered)
          if [ -z "$mine" ]; then
            echo "::warning::Name the issue this pull request delivers with a Linear keyword, for example 'Fixes OCT-123' or 'Part of OCT-123'."
            exit 0
          fi
          echo "Delivers: $(echo $mine)"

          gh pr list --repo "$REPO" --state open --limit 500 \
            --json number,title,body,headRefName,baseRefName > "$RUNNER_TEMP/open.json"

          # Layers of one linear stack legitimately share an issue. Walk each
          # pull request's base chain through open pull requests; two pull
          # requests are one stack when one sits in the other's chain.
          # Siblings branched from the same parent are not, and still fail.
          declare -A base_of
          while IFS=$'\t' read -r h b; do base_of["$h"]="$b"; done \
            < <(jq -r '.[] | [.headRefName, .baseRefName] | @tsv' "$RUNNER_TEMP/open.json")
          base_of["$HEAD"]="$BASE"
          chain() {
            local ref="$1" depth=0
            while [ -n "$ref" ] && [ "$depth" -lt 50 ]; do
              echo "$ref"; ref="${base_of[$ref]:-}"; depth=$((depth + 1))
            done
          }
          my_chain=$(chain "$HEAD")

          failed=0
          while read -r other; do
            n=$(jq -r .number <<<"$other")
            [ "$n" = "$NUMBER" ] && continue
            other_head=$(jq -r .headRefName <<<"$other")
            if grep -qxF "$other_head" <<<"$my_chain" || chain "$other_head" | grep -qxF "$HEAD"; then continue; fi
            theirs=$(jq -r '(.title // "") + "\n" + (.body // "")' <<<"$other" | delivered)
            shared=$(comm -12 <(echo "$mine") <(echo "$theirs") | paste -sd, -)
            if [ -n "$shared" ]; then
              echo "::error::#$n is already open for ${shared}. Push this work to #$n's branch, or stack on it, instead of opening another pull request."
              failed=1
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/open.json")
          exit "$failed"
