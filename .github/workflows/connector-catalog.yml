name: Connector catalog probe

# Probes every bundled connector address and docs page, so a vendor that moved
# or dropped its server shows up as a failed run instead of a broken Connect.
# It reaches the network, so it stays out of the pull request checks.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun run connectors:probe
