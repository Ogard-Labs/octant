name: Docs

# Build the guide for https://octant.sh/docs/. VPS deployment and releases
# are maintainer-owned; this workflow only checks and uploads static files.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check the guide
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OCTANT_DOCS_BASE: /docs/
      OCTANT_DOCS_URL: https://octant.sh/docs/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --filter @octant/docs check:links
      - run: bun run --filter @octant/docs check:sidebar
      - run: bun run --filter @octant/docs test
      - run: bun run --filter @octant/docs typecheck
      - run: bun run --filter @octant/docs build
      - uses: actions/upload-artifact@v4
        with:
          name: octant-docs-${{ github.sha }}
          path: apps/docs/dist
          retention-days: 7
