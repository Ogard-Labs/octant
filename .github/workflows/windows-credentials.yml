name: Windows native credentials

on:
  pull_request:
    paths:
      - .github/workflows/windows-credentials.yml
      - apps/desktop/native/windows-credential-helper/**
      - apps/desktop/src/desktopCredentialStore*
      - apps/desktop/src/hostIdentityKeychain*
      - apps/desktop/src/windowsHostIdentity*
      - apps/desktop/src/main.ts
      - packages/host-runtime/src/windowsCredentialStore*
      - scripts/smoke-windows-credentials.ts
      - scripts/windows-credential-coordination.ps1
      - scripts/smoke-windows-host-identity.ts
      - scripts/windows-host-identity-fixture.ps1
      - scripts/run-windows-host-identity-electron.ts
      - packages/host-runtime/src/credentialBroker*
      - apps/server/src/providers/credentialBrokerClient*
      - apps/server/src/replica/replicaDeviceKeyService*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-credentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Native Windows credential lifecycle
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install locked dependencies without package scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the fixed native helper
        run: |
          cmake -S apps/desktop/native/windows-credential-helper -B "$env:RUNNER_TEMP/credential-build" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/credential-build" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise owned synthetic credentials and confirm cleanup
        run: |
          bun scripts/smoke-windows-credentials.ts "$env:RUNNER_TEMP/credential-build/Release/octant-credential-helper.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the non-exporting desktop identity in Bun, Node and Electron
        run: |
          $nativeHelper = "$env:RUNNER_TEMP/credential-build/Release/octant-credential-helper.exe"
          $identityFixture = "$env:GITHUB_WORKSPACE/scripts/windows-host-identity-fixture.ps1"
          bun scripts/smoke-windows-host-identity.ts $nativeHelper $identityFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun build scripts/smoke-windows-host-identity.ts --target=node --format=esm --outfile="$env:RUNNER_TEMP/octant-host-identity-smoke.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:RUNNER_TEMP/octant-host-identity-smoke.mjs" $nativeHelper $identityFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-windows-host-identity-electron.ts "$env:RUNNER_TEMP/octant-host-identity-smoke.mjs" $nativeHelper $identityFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: octant-windows-provider-credential-helper-qa
          path: ${{ runner.temp }}/credential-build/Release/octant-credential-helper.exe
          if-no-files-found: error
          retention-days: 3
