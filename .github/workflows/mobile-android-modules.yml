name: Mobile (Android native modules)

on:
  pull_request:
    # A draft runs nothing; marking it ready for review starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/mobile/modules/**
      - apps/mobile/plugins/**
      - apps/mobile/app.config.ts
      - apps/mobile/package.json
      - bun.lock
      - .github/workflows/mobile-android-modules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.event.pull_request.draft != true
    name: Compile the Android modules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_ENV: production
      EAS_BUILD_PROFILE: production
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_TELEMETRY_DETACH: "1"
      EXPO_OFFLINE: "1"
      OCTANT_MOBILE_PUSH: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/package.json', 'apps/mobile/modules/**', 'apps/mobile/plugins/**') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: node ../../node_modules/expo/bin/cli prebuild --platform android --no-install --skip-dependency-update react,react-native,expo,react-native-web
      - name: Compile the modules without signing or a Firebase project
        working-directory: apps/mobile/android
        run: >-
          ./gradlew --no-daemon --max-workers=2
          :octant-device-protection:compileReleaseKotlin
          :octant-pinned-tls:compileReleaseKotlin
          :octant-push:compileReleaseKotlin
