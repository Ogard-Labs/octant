name: Packaged Browser owner native lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/packaged-browser-owner-native.yml
      - scripts/smoke-packaged-browser-owner-native.ts
      - scripts/packaged-browser-owner-ax.swift
      - scripts/packaged-browser-owner-provider.ts
      - scripts/packaged-browser-owner-provider.test.ts
      - scripts/packaged-browser-owner-electron-cache.ts
      - scripts/packaged-browser-owner-electron-cache.test.ts
      - scripts/package-desktop.ts
      - scripts/desktop-node-runtime.ts
      - scripts/packaged-browser-owner-driver-cache.ts
      - scripts/packaged-browser-owner-driver-cache.test.ts

permissions:
  contents: read

concurrency:
  group: packaged-browser-owner-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Packaged Browser owner native lifecycle
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing native interaction permission
        run: |
          test "$(uname -m)" = arm64
          test "$(osascript -e 'tell application "System Events" to get UI elements enabled')" = true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Seed only the pinned Electron archive from its official asset API
        timeout-minutes: 4
        env:
          OCTANT_QA_GITHUB_TOKEN: ${{ github.token }}
          electron_config_cache: ${{ runner.temp }}/browser-owner-electron-cache
        run: bun scripts/packaged-browser-owner-electron-cache.ts
      - run: node node_modules/electron/install.js
        env:
          electron_config_cache: ${{ runner.temp }}/browser-owner-electron-cache
      - name: Seed only the pinned driver through its canonical verifier
        timeout-minutes: 5
        env:
          OCTANT_QA_GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/packaged-browser-owner-driver-cache.ts
      - name: Package source without signing or publication
        timeout-minutes: 25
        env:
          electron_config_cache: ${{ runner.temp }}/browser-owner-electron-cache
        run: bun run package:desktop
      - name: Bind only the owned fixture folder through normal Work Project UI
        timeout-minutes: 5
        env:
          OCTANT_QA_OUTPUT: ${{ runner.temp }}/packaged-browser-owner-native
        run: bun scripts/smoke-packaged-browser-owner-native.ts --project-picker-discovery
      - name: Remove the owned driver fixture cache
        if: always()
        timeout-minutes: 1
        run: bun scripts/packaged-browser-owner-driver-cache.ts --cleanup
      - name: Remove the owned Electron fixture cache
        if: always()
        timeout-minutes: 1
        env:
          electron_config_cache: ${{ runner.temp }}/browser-owner-electron-cache
        run: bun scripts/packaged-browser-owner-electron-cache.ts --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-browser-owner-native
          path: ${{ runner.temp }}/packaged-browser-owner-native
          if-no-files-found: ignore
          retention-days: 7
