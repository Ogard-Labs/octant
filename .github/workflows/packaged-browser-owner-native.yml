name: Packaged Browser owner native lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/packaged-browser-owner-native.yml
      - scripts/smoke-packaged-browser-owner-native.ts
      - scripts/packaged-browser-owner-ax.swift
      - scripts/packaged-browser-owner-provider.ts
      - scripts/packaged-browser-owner-provider.test.ts

permissions:
  contents: read

concurrency:
  group: packaged-browser-owner-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Packaged Browser owner native lifecycle
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing native interaction permission
        run: |
          test "$(uname -m)" = arm64
          test "$(osascript -e 'tell application "System Events" to get UI elements enabled')" = true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Package source without signing or publication
        timeout-minutes: 25
        run: bun run package:desktop
      - name: Discover normal Work folder picker ownership without selection
        timeout-minutes: 5
        env:
          OCTANT_QA_OUTPUT: ${{ runner.temp }}/packaged-browser-owner-native
        run: bun scripts/smoke-packaged-browser-owner-native.ts --project-picker-discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-browser-owner-native
          path: ${{ runner.temp }}/packaged-browser-owner-native
          if-no-files-found: ignore
          retention-days: 7
