name: Mobile (iOS native modules)

# Compiles the Swift Expo modules in apps/mobile/modules against the Expo
# version the app pins, so a break shows on the pull request rather than in the
# next TestFlight build. It generates the native project and builds only the
# two module targets for the Simulator with signing off, so it reads no secret
# and needs no account. It runs only when a module, the app config, or the
# lockfile changes. It is not a required check: path filters do not apply to
# the merge queue, and a required check that is skipped counts as passed.
on:
  pull_request:
    paths:
      - "apps/mobile/modules/**"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/package.json"
      - "bun.lock"
      - ".github/workflows/mobile-ios-modules.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ios-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile the iOS modules (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The Expo version the app pins builds a Swift package that needs Swift
      # tools 6.2 (Xcode 26); the runner's default Xcode 16.4 stops at package
      # resolution. Pick the newest installed release Xcode 26 or later, and
      # fail by name if the image has none.
      - name: Select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi 'beta\|rc' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "No release Xcode 26 or later on this runner image:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install
      - name: Install the pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the module targets for the Simulator
        working-directory: apps/mobile/ios
        run: |
          for scheme in OctantDeviceProtection OctantPinnedTls; do
            xcodebuild build \
              -workspace Octant.xcworkspace \
              -scheme "$scheme" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          done
