name: Mobile (iOS native modules)

# Compiles the Swift Expo modules in apps/mobile/modules against the Expo
# version the app pins, so a break shows on the pull request rather than in the
# next TestFlight build. It generates the native project and builds only the
# module targets and the notification service extension for the Simulator with
# signing off, so it reads no secret and needs no account. It runs only when a
# module, the app config, a config plugin, or the lockfile changes. It is not a required check: path filters do not apply to
# the merge queue, and a required check that is skipped counts as passed.
on:
  pull_request:
    paths:
      - "apps/mobile/modules/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/package.json"
      - "bun.lock"
      - ".github/workflows/mobile-ios-modules.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ios-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile the iOS modules (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The Expo version the app pins builds a Swift package that needs Swift
      # tools 6.2 and C++ interop that Xcode 26.3 rejects (the first run on
      # macos-15 stopped at package resolution, the second at
      # RuntimeScheduler.h). Pick the newest installed release Xcode and print
      # what the image has, so a failure names the version.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi 'beta\|rc' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "No release Xcode 26 or later on this runner image:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      # Built with the push capability on, so the notification service
      # extension target exists to be compiled.
      - name: Generate the native iOS project
        working-directory: apps/mobile
        env:
          OCTANT_MOBILE_PUSH: "1"
        run: bunx expo prebuild --platform ios --no-install
      - name: Install the pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the module targets for the Simulator
        working-directory: apps/mobile/ios
        run: |
          for scheme in OctantDeviceProtection OctantPinnedTls OctantPush; do
            xcodebuild build \
              -workspace Octant.xcworkspace \
              -scheme "$scheme" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          done
      # The notification service extension is a target of the app project, added
      # by the app's config plugin, so it is built from that project.
      - name: Build the notification service extension for the Simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild build \
            -project Octant.xcodeproj \
            -target OctantNotificationService \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
