# Nightly preview ring.
#
# Builds what is on `main`, signs and notarizes it, and publishes a signed feed
# at `<base>/preview/darwin-arm64.json`. Per `docs/decisions/0034` these are one
# deliverable: an updater fed by unsigned builds is an unauthenticated
# code-delivery channel, so this workflow either produces a signed release or
# fails.
#
# Nightly rather than per-merge on purpose. Ten merges in a day are one useful
# preview, and each build costs a notarization and a download for everyone
# following the ring.
name: Release (preview)

on:
  schedule:
    # 03:00 UTC. Nothing depends on the hour; it is outside the working day so a
    # failure is waiting rather than interrupting.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not moved since the last preview
        type: boolean
        default: false

concurrency:
  group: release-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Split from the build so the "nothing changed" answer costs seconds on a
  # Linux runner rather than minutes on a macOS one.
  decide:
    name: Decide whether there is anything to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          declared=$(grep -oE 'version: "[^"]+"' scripts/package-desktop.ts | head -1 | cut -d'"' -f2)
          # The date and the run number both go in: the date is for whoever
          # reads the version, and the run number keeps two builds on one day
          # distinct. Both are numeric, so they order the way the updater
          # compares prerelease identifiers.
          version="${declared}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          last=$(gh release list --limit 30 --json tagName,isPrerelease,targetCommitish \
            --jq 'map(select(.isPrerelease)) | first | .targetCommitish // ""')
          if [ "${FORCE:-false}" = "true" ] || [ -z "$last" ] || [ "$last" != "$(git rev-parse HEAD)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main has not moved since the last preview ($last). Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build, sign, notarize, and publish
    needs: decide
    if: needs.decide.outputs.build == 'true'
    # Holds the Developer ID, the notary profile, the feed signing key, and the
    # SSH key that publishes the feed. Scoping them to an environment keeps them
    # off every other workflow in the repository.
    environment: preview
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=!@octant/desktop --filter=!@octant/scripts
      - run: bun run --cwd apps/desktop build

      # Values that are not credentials are repository variables rather than
      # secrets: the team id and the identity appear in the signature, the
      # known-hosts entry is a public key, and a path is a path. Keeping them
      # out of the secret store means the secrets that remain are all things
      # whose disclosure would actually matter.
      - name: Import the Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.OCTANT_SIGNING_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.OCTANT_SIGNING_CERTIFICATE_PASSWORD }}

      - name: Store the notary credentials
        env:
          NOTARY_KEY: ${{ secrets.OCTANT_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ vars.OCTANT_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.OCTANT_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_KEY" > "${RUNNER_TEMP}/notary.p8"
          xcrun notarytool store-credentials octant-notary \
            --key "${RUNNER_TEMP}/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "${RUNNER_TEMP}/notary.p8"

      - name: Package, sign, and notarize
        env:
          OCTANT_RELEASE_BUILD: "1"
          OCTANT_RELEASE_VERSION: ${{ needs.decide.outputs.version }}
          OCTANT_SIGNING_IDENTITY: ${{ vars.OCTANT_SIGNING_IDENTITY }}
          OCTANT_SIGNING_TEAM_ID: ${{ vars.OCTANT_SIGNING_TEAM_ID }}
          OCTANT_NOTARY_PROFILE: octant-notary
        run: bun run package:desktop

      - name: Publish the release archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          archive=$(ls out/Octant-*-darwin-arm64.zip)
          gh release create "v${VERSION}" "$archive" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Octant ${VERSION} (preview)" \
            --notes "Preview build of main at ${GITHUB_SHA}. Not a stable release."
          # Constructed rather than read back from the API: the download URL of
          # a release asset is determined by the tag and the file name, and
          # deriving it means the feed cannot end up pointing at whichever
          # asset a list query happened to return first.
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$archive")" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Sign the feed
        env:
          OCTANT_UPDATE_FEED_PRIVATE_KEY: ${{ secrets.OCTANT_UPDATE_FEED_PRIVATE_KEY }}
          VERSION: ${{ needs.decide.outputs.version }}
          ARTIFACT_URL: ${{ steps.release.outputs.url }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          bun scripts/sign-update-feed.ts \
            --version "$VERSION" \
            --ring preview \
            --platform darwin \
            --arch arm64 \
            --url "$ARTIFACT_URL" \
            --artifact "$ARCHIVE" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --out "${RUNNER_TEMP}/feed/preview/darwin-arm64.json"

      - name: Publish the feed
        env:
          SSH_KEY: ${{ secrets.OCTANT_FEED_SSH_KEY }}
          SSH_HOST: ${{ vars.OCTANT_FEED_SSH_HOST }}
          SSH_USER: ${{ vars.OCTANT_FEED_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.OCTANT_FEED_SSH_KNOWN_HOSTS }}
          REMOTE_PATH: ${{ vars.OCTANT_FEED_REMOTE_PATH }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/octant_feed
          # Pinned rather than accepted on first use: a feed pushed to whatever
          # answers on that address is a feed published to an unknown host.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/octant_feed ~/.ssh/known_hosts
          # GNU rsync understands --chmod; the macOS runner ships the BSD
          # client, which rejects that flag. Permissions are already set on the
          # destination directory, so archive+compress is enough.
          rsync --archive --compress \
            --rsh "ssh -i ~/.ssh/octant_feed -o IdentitiesOnly=yes" \
            "${RUNNER_TEMP}/feed/preview" \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"
