# Octant's Preview channel: a build you start by hand.
#
# Builds whatever ref it is started on as Octant (the stable flavor) on the
# `candidate` ring, which Octant offers as its Preview channel, so a test
# install can run a chosen branch. Publishes to
# `<base>/candidate/<platform>-<arch>.octant.json`, plus an old-shape document at
# `<platform>-<arch>.preview-key.json` for candidate installs built before the
# release named its app. It never runs on a schedule and never builds Octant
# Nightly: that is `release-nightly.yml`. The build, signing and feed jobs are
# `release-build.yml`; a candidate skips the Nightly usable-client preflight and
# is not held by it (`docs/design/nightly-app.md`, "Which build is which").
name: Release (preview)

on:
  workflow_dispatch:

# One release run at a time across Nightly and Preview: both write feed files
# to the same mailbox releases.
concurrency:
  group: release-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    name: Name the build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          set -euo pipefail
          # The declared version is this workflow's own. With the date and the
          # run number it keeps every candidate strictly newer than the last,
          # which is all the updater accepts.
          declared=$(grep -oE 'version: "[^"]+"' scripts/package-desktop.ts | head -1 | cut -d'"' -f2)
          echo "version=${declared}-candidate.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign and publish
    needs: decide
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.decide.outputs.version }}
      ring: candidate
      flavor: stable
      product: Octant
      # Release asset names carry no space: GitHub renames an uploaded asset
      # with one, and the feed URL needs the exact published name.
      asset_prefix: Octant
    secrets: inherit
