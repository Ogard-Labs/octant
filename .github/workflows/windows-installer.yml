# The per-user Windows installer, unsigned, on a real Windows runner.
#
# Builds the package and both installer builds exactly as the release
# workflow does, minus Authenticode (which needs the release environment's
# Azure federation), then installs silently for the runner's user, starts the
# installed app until it shows a window and creates its host profile, refuses
# an install while the installed program runs,
# installs over the stopped one, and uninstalls. Nothing here is published;
# the installer artifact is kept three days for inspection.
name: Windows installer

on:
  pull_request:
    paths:
      - .github/workflows/windows-installer.yml
      - apps/desktop/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - scripts/**
      - bun.lock
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Per-user installer (unsigned)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate the installer scripts' syntax
        run: |
          foreach ($octantScript in @('scripts/smoke-windows-installer.ps1', 'scripts/windows-installer/install-nsis.ps1', 'scripts/windows-installer/start-installed.ps1')) {
            $octantTokens = $null
            $octantParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $octantScript), [ref]$octantTokens, [ref]$octantParseErrors)
            if ($octantParseErrors.Count) { throw ($octantParseErrors.Message -join "`n") }
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Prepare the pinned Electron runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-ci-electron.ts
      - name: Fetch the pinned NSIS
        run: ./scripts/windows-installer/install-nsis.ps1
      - name: Build the Windows package
        env:
          OCTANT_PACKAGE_TARGET: win32-x64
        run: bun run package:desktop
      - name: Write the uninstaller
        run: bun scripts/package-windows-installer.ts uninstaller --package out/Octant-win32-x64 --out "out/windows-uninstaller/Uninstall Octant.exe"
      - name: Build the installer
        run: bun scripts/package-windows-installer.ts installer --package out/Octant-win32-x64 --uninstaller "out/windows-uninstaller/Uninstall Octant.exe" --out-dir out/windows-installer
      - name: Refuse the unsigned installer the way an update would
        run: |
          $octantInstaller = @(Get-ChildItem -LiteralPath out/windows-installer -Filter '*-win32-x64-setup.exe')
          if ($octantInstaller.Count -ne 1) { throw 'Expected one installer' }
          bun scripts/smoke-windows-installer-trust.ts $octantInstaller[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The runner's token is elevated with Administrators as its default
      # owner, which the native profile refuses; the existing owned-job
      # launcher starts the app with a user-owned token, as for the QA package.
      - name: Build the owned-job launcher
        run: |
          cmake -S scripts/windows-desktop-qa -B "$env:RUNNER_TEMP/desktop-owner" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/desktop-owner" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, start, update over and uninstall for this user
        run: |
          $octantInstaller = @(Get-ChildItem -LiteralPath out/windows-installer -Filter '*-win32-x64-setup.exe')
          ./scripts/smoke-windows-installer.ps1 -Installer $octantInstaller[0].FullName -Launcher "$env:RUNNER_TEMP/desktop-owner/Release/octant-windows-desktop-owner.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: octant-windows-x64-installer-unsigned
          path: out/windows-installer/*-win32-x64-setup.exe
          if-no-files-found: error
          retention-days: 3
