name: Windows native confinement

on:
  pull_request:
    paths:
      - .github/workflows/windows-confinement.yml
      - scripts/windows-confinement/**
      - apps/desktop/native/windows-confine/**
      - apps/server/src/process/windowsConfinement*
      - apps/server/src/process/seatbeltProfile.ts
      - apps/server/src/process/secretGuard.ts
      - packages/domain/src/windowsConfinementPolicy*
      - packages/domain/src/secretGuardPolicy.ts
      - scripts/smoke-windows-confinement.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-confinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Measure native Windows confinement
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile with the native Windows SDK
        shell: pwsh
        run: |
          cmake -S scripts/windows-confinement -B "$env:RUNNER_TEMP/confinement-build" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration failed' }
          cmake --build "$env:RUNNER_TEMP/confinement-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed' }
      - name: Measure AppContainer and Job behavior
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/confinement-build/Release/octant-windows-confinement.exe" "$env:RUNNER_TEMP/windows-confinement.json"
          if ($LASTEXITCODE -ne 0) { throw 'Probe setup, execution or owned cleanup failed' }
      - name: Record the measured verdict
        if: always()
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP/windows-confinement.json"
          if (!(Test-Path $path)) { throw 'No native evidence was produced' }
          $result = Get-Content -Raw $path | ConvertFrom-Json
          "## Native Windows feasibility`n`nProduction ready: **NO**. This fixture enables no product capability.`n`nStatus: $($result.status)`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($measurement in $result.measurements) {
            "- $($measurement.name): passed=$($measurement.passed), observed=$($measurement.observed), expected=$($measurement.expected)" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-confinement-feasibility
          path: ${{ runner.temp }}/windows-confinement.json
          if-no-files-found: error
          retention-days: 7

  launcher:
    # The dormant launcher's real AppContainer, ACL and job evidence on a
    # hosted runner (an administrator account). It runs no provider and
    # admits no Windows launch: the port still refuses Windows by default.
    name: Confine owned fixtures through the launcher
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies without package scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the fixed native launcher
        shell: pwsh
        run: |
          cmake -S apps/desktop/native/windows-confine -B "$env:RUNNER_TEMP/confine-build" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration failed' }
          cmake --build "$env:RUNNER_TEMP/confine-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed' }
      - name: Confine owned fixtures through the server's port
        shell: pwsh
        run: |
          bun scripts/smoke-windows-confinement.ts "$env:RUNNER_TEMP/confine-build/Release/octant-windows-confine.exe"
          if ($LASTEXITCODE -ne 0) { throw 'A confinement check failed' }
