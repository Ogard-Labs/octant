name: Windows CLI service lifecycle

on:
  pull_request:
    paths:
      - .github/workflows/windows-cli.yml
      - packages/cli/src/cli.ts
      - packages/cli/src/serverLifecycle.ts
      - packages/cli/src/serverRun.ts
      - packages/cli/src/serviceManager.ts
      - packages/cli/src/web.ts
      - packages/cli/src/windowsHost.ts
      - packages/host-runtime/native/windows-host-owner/**
      - packages/host-runtime/src/windowsHost*
      - apps/server/src/windowsForeground.ts
      - scripts/windows-cli/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Run the octant CLI's per-user service on Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      # The CLI and the server it starts from a source run both load their
      # native binding and credential helper from `native` beside the checkout.
      - name: Build the native host binding and credential helper beside the checkout
        run: |
          $octantNodeVersion = (node -p process.version).Trim()
          if ($octantNodeVersion -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid SDK version' }
          $octantArchive = "node-$octantNodeVersion-headers.tar.gz"
          $octantBase = "https://nodejs.org/download/release/$octantNodeVersion"
          Invoke-WebRequest "$octantBase/$octantArchive" -OutFile "$env:RUNNER_TEMP/$octantArchive"
          Invoke-WebRequest "$octantBase/win-x64/node.lib" -OutFile "$env:RUNNER_TEMP/node.lib"
          $octantSums = (Invoke-WebRequest "$octantBase/SHASUMS256.txt").Content -split "`n"
          foreach ($octantEntry in @(@($octantArchive, $octantArchive), @('node.lib', 'win-x64/node.lib'))) {
            $octantExpected = ($octantSums | Where-Object { $_.Trim().EndsWith("  $($octantEntry[1])") }).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
            $octantActual = (Get-FileHash "$env:RUNNER_TEMP/$($octantEntry[0])" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($octantActual -ne $octantExpected) { throw 'Public SDK checksum mismatch' }
          }
          tar -xf "$env:RUNNER_TEMP/$octantArchive" -C "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S packages/host-runtime/native/windows-host-owner -B "$env:RUNNER_TEMP/owner-build" -A x64 "-DOCTANT_NODE_HEADERS=$env:RUNNER_TEMP/node-$octantNodeVersion/include/node" "-DOCTANT_NODE_IMPORT_LIB=$env:RUNNER_TEMP/node.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/owner-build" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S apps/desktop/native/windows-credential-helper -B "$env:RUNNER_TEMP/credential-build" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/credential-build" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $octantNative = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'native'
          New-Item -ItemType Directory -Path $octantNative -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/owner-build/Release/octant-windows-host-owner.node" $octantNative
          Copy-Item "$env:RUNNER_TEMP/credential-build/Release/octant-credential-helper.exe" $octantNative
      - name: Report the runner account's elevation
        run: |
          $octantPrincipal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Output "Administrator token: $($octantPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
      - name: Resolve paths, start, reach, stop, disable and uninstall the per-user service
        run: |
          bun scripts/windows-cli/smoke.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
